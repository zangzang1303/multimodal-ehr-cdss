name: M-CDSS CI Pipeline

on:
  push:
    branches: [main, master, p3m3]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Lint & Unit/Integration Tests (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU runtime & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-deploy.txt pytest httpx flake8 matplotlib

      - name: Run lightweight lint checks
        run: |
          flake8 src/agent/ src/api/ src/evaluation/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest (CPU fast suite)
        run: |
          pytest tests/test_agent_rag.py tests/test_agent_explain_api.py tests/test_evidence_grounder.py tests/test_knowledge_ingest.py tests/test_api_endpoints.py tests/test_multimodal_model.py -m "not gpu and not slow" -v

  frontend-build:
    name: Frontend Next.js Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js standalone production bundle
        run: npm run build
