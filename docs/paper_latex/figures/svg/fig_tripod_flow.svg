<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="100%" height="100%" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F4C81" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#FFFFFF" rx="8" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#0F4C81">
    SƠ ĐỒ DÒNG THIẾT KẾ ĐOÀN HỆ &amp; PHÂN CHIA DỮ LIỆU (CHUẨN TRIPOD-AI)
  </text>
  <text x="450" y="52" text-anchor="middle" font-size="12" fill="#64748B">
    Nguồn dữ liệu kết hợp, làm sạch chống rò rỉ và phân chia nhóm theo định danh bệnh nhân
  </text>

  <!-- Box 1: Synthea EHR -->
  <g transform="translate(60, 75)" filter="url(#shadow)">
    <rect width="320" height="75" rx="6" fill="#F0F7FF" stroke="#0F4C81" stroke-width="1.5" />
    <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C81">Synthea EHR Simulation</text>
    <text x="160" y="44" text-anchor="middle" font-size="11" fill="#1E293B">N₁ = 1.171 bệnh nhân tổng hợp (Synthea)</text>
    <text x="160" y="62" text-anchor="middle" font-size="10" fill="#64748B">(Dữ liệu bảng: nhân khẩu, sinh hiệu, lab)</text>
  </g>

  <!-- Box 2: MTSamples -->
  <g transform="translate(520, 75)" filter="url(#shadow)">
    <rect width="320" height="75" rx="6" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.5" />
    <text x="160" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0D9488">MTSamples Repository</text>
    <text x="160" y="44" text-anchor="middle" font-size="11" fill="#1E293B">N₂ = 4.999 ghi chú phiên mã (MTSamples)</text>
    <text x="160" y="62" text-anchor="middle" font-size="10" fill="#64748B">(Văn bản tự do: bệnh sử, khám thực thể)</text>
  </g>

  <!-- Connecting Lines from Sources to Filter -->
  <path d="M 220 150 L 220 185 L 450 185" fill="none" stroke="#0F4C81" stroke-width="1.5" />
  <path d="M 680 150 L 680 185 L 450 185" fill="none" stroke="#0F4C81" stroke-width="1.5" />
  <path d="M 450 185 L 450 205" fill="none" stroke="#0F4C81" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 3: Exclusion & Anti-leakage Filtering -->
  <g transform="translate(200, 205)" filter="url(#shadow)">
    <rect width="500" height="110" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" />
    <text x="250" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#DC2626">Tiêu chí Loại trừ, Làm sạch Chống Rò rỉ &amp; Ghép Cặp</text>
    <text x="20" y="42" font-size="10.5" fill="#1E293B">• 2.000 bản ghi (500/lớp) từ 478 bệnh nhân gốc; viêm phổi chỉ 8 bệnh nhân gốc</text>
    <text x="20" y="58" font-size="10.5" fill="#1E293B">• 305 ghi chú MTSamples khớp từ khoá; 1.695 ghi chú template</text>
    <text x="20" y="74" font-size="10.5" fill="#1E293B">• Cấm xét nghiệm tiêu chuẩn vàng: FEV₁/FVC (GOLD), Siêu âm EF (ESC), Cấy đờm vi sinh</text>
    <text x="20" y="90" font-size="10.5" fill="#1E293B">• Che từ khóa nhãn ([REDACTED_DIAGNOSIS]) &amp; giả lập PHI để kiểm thử pipeline de-ID</text>
    <text x="20" y="104" font-size="10" fill="#64748B">• Chèn khối sinh hiệu vào ghi chú theo template tiếp nhận (cội nguồn phát hiện RQ2)</text>
  </g>

  <!-- Connecting Line from Filter to Canonical -->
  <path d="M 450 315 L 450 345" fill="none" stroke="#0F4C81" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Box 4: Canonical Cohort -->
  <g transform="translate(170, 345)" filter="url(#shadow)">
    <rect width="560" height="65" rx="6" fill="#F8FAFC" stroke="#0F4C81" stroke-width="1.8" />
    <text x="280" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0F4C81">ĐOÀN HỆ LÂM SÀNG CHUẨN HÓA M-CDSS (N = 2.000)</text>
    <text x="280" y="44" text-anchor="middle" font-size="11" fill="#1E293B">Cân bằng 4 nhóm bệnh: Hen phế quản (500) | COPD (500) | Suy tim (500) | Viêm phổi (500)</text>
    <text x="280" y="58" text-anchor="middle" font-size="10" fill="#64748B">Vector đặc trưng bảng 13 biến + Văn bản ghi chú lâm sàng đã khử định danh</text>
  </g>

  <!-- Connecting Lines from Canonical to Splits -->
  <path d="M 450 410 L 450 435" fill="none" stroke="#0F4C81" stroke-width="1.5" />
  <path d="M 450 435 L 180 435 L 180 460" fill="none" stroke="#0F4C81" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 450 435 L 450 460" fill="none" stroke="#0F4C81" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 450 435 L 720 435 L 720 460" fill="none" stroke="#0F4C81" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Split Boundary Group -->
  <rect x="40" y="445" width="820" height="155" rx="8" fill="#F1F5F9" fill-opacity="0.5" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 4" />
  <text x="450" y="590" text-anchor="middle" font-size="11" font-weight="600" fill="#0F4C81">
    Stratified Group Splitting theo patient_id &amp; source_note_group (Kiểm toán 0% rò rỉ: P_train ∩ P_val ∩ P_test = ∅)
  </text>

  <!-- Box 5: Train Split -->
  <g transform="translate(60, 460)" filter="url(#shadow)">
    <rect width="240" height="115" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5" />
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">TẬP HUẤN LUYỆN (TRAIN)</text>
    <text x="120" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">N = 1.425 (71,25%)</text>
    <text x="20" y="58" font-size="10" fill="#334155">• Hen phế quản: 358</text>
    <text x="20" y="72" font-size="10" fill="#334155">• COPD: 358</text>
    <text x="20" y="86" font-size="10" fill="#334155">• Suy tim: 340 | Viêm phổi: 369</text>
    <text x="120" y="104" text-anchor="middle" font-size="9.5" font-style="italic" fill="#16A34A">Fit MICE imputer &amp; weights</text>
  </g>

  <!-- Box 6: Val Split -->
  <g transform="translate(330, 460)" filter="url(#shadow)">
    <rect width="240" height="115" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#D97706">TẬP HIỆU CHUẨN (VAL)</text>
    <text x="120" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">N = 273 (13,65%)</text>
    <text x="20" y="58" font-size="10" fill="#334155">• Hen phế quản: 71</text>
    <text x="20" y="72" font-size="10" fill="#334155">• COPD: 71</text>
    <text x="20" y="86" font-size="10" fill="#334155">• Suy tim: 54 | Viêm phổi: 77</text>
    <text x="120" y="104" text-anchor="middle" font-size="9.5" font-style="italic" fill="#D97706">Early stopping &amp; Temp scaling (T)</text>
  </g>

  <!-- Box 7: Test Split -->
  <g transform="translate(600, 460)" filter="url(#shadow)">
    <rect width="240" height="115" rx="6" fill="#FAF5FF" stroke="#9333EA" stroke-width="1.5" />
    <text x="120" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#9333EA">TẬP KIỂM THỬ (TEST)</text>
    <text x="120" y="40" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">N = 302 (15,10%)</text>
    <text x="20" y="58" font-size="10" fill="#334155">• Hen phế quản: 71</text>
    <text x="20" y="72" font-size="10" fill="#334155">• COPD: 71</text>
    <text x="20" y="86" font-size="10" fill="#334155">• Suy tim: 106 | Viêm phổi: 54</text>
    <text x="120" y="104" text-anchor="middle" font-size="9.5" font-style="italic" fill="#9333EA">Hold-out Benchmark &amp; DCA</text>
  </g>

</svg>
