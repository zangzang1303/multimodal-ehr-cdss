# ==============================================================================
# Multimodal EHR CDSS - Full-Stack Docker Compose (Phase 2 - Production Ready)
# Usage: docker compose up --build -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Vector Database Service (Qdrant for Clinical Practice Guidelines RAG)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mcdss-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ./data/vector_store:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mcdss-network

  # ----------------------------------------------------------------------------
  # 2. Backend API Service (FastAPI Multimodal Inference & Agentic RAG)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcdss-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - PYTHONPATH=/app
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_URL=http://qdrant:6333
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000}
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mcdss-network

  # ----------------------------------------------------------------------------
  # 3. Frontend Web UI Service (Next.js 14 Clinical Workbench & DCA Dashboard)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: mcdss-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - mcdss-network

networks:
  mcdss-network:
    name: mcdss-internal-net
    driver: bridge

