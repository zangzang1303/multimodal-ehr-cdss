[pytest]
minversion = 8.0
addopts = -v --tb=short
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    gpu: tests requiring CUDA GPU hardware
    slow: tests requiring large HuggingFace weights or heavy external services
filterwarnings =
    ignore::DeprecationWarning
